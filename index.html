<style>

tem{border-top:1px solid #edf0f4;padding:14px 0}.item:first-child{border-top:0}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stats div{background:#f7f9fc;border-radius:12px;padding:12px;min-width:0}.stats small{display:block;color:#64748b}.stats strong{display:block;margin-top:5px;font-size:17px;overflow-wrap:anywhere}.photos{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.photos img{width:92px;height:92px;object-fit:cover;border-radius:10px;border:1px solid #ddd}.exercise{background:#f8fafc;padding:12px;border-radius:14px;margin:12px 0}.sets{width:100%;border-collapse:collapse}.sets th,.sets td{padding:6px 4px;text-align:left}.sets input,.sets select{padding:8px;margin:0}.sets .num{width:100%}.sets th{font-size:12px;color:#64748b}.sets .remove{padding:7px}.chart{width:100%;height:180px;display:block}.chart text{font-size:11px;fill:#64748b}.notice{background:#eff6ff;padding:12px;border-radius:12px;color:#1e40af;font-size:13px}.empty{color:#64748b;padding:18px 0}.pill{display:inline-block;border-radius:20px;background:#e2e8f0;padding:3px 8px;font-size:12px;margin-right:4px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{padding-top:14px}.tabs button{font-size:12px}.panel{padding:14px}.sets th,.sets td{padding:4px 2px}.sets input,.sets select{font-size:14px;padding:6px 3px}}

</style></head><body><main class="shell"><div class="top"><div><h1>🌱 LIFE OS</h1><div class="muted">食事・筋トレ・身体管理</div></div><button class="btn mini" id="settingsBtn">⚙️ 設定・バックアップ</button></div><div id="content"></div></main>
<nav class="tabs" id="tabs"><button data-page="home">🏠 ホーム</button><button data-page="food">🍚 食事</button><button data-page="workout">💪 筋トレ</button><button data-page="body">⚖️ 身体</button></nav>
<script>
'use strict';
const KEY='life-os-health-v1';
const empty=()=>({settings:{height:170,weightGoal:68,kcal:2200,p:140,f:65,c:250},body:[],food:[],exercises:[{id:'ex-bench',name:'ベンチプレス',part:'胸'},{id:'ex-squat',name:'スクワット',part:'脚'},{id:'ex-dead',name:'デッドリフト',part:'背中'}],workouts:[]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||empty()}catch{db=empty()}
const defaults=empty();for(const k of Object.keys(defaults))if(!(k in db))db[k]=defaults[k];
let page='home',bodyEdit=null,foodEdit=null,workoutEdit=null,exerciseSelected='',pendingPhotos=[],workoutDraft=[];
const $=id=>document.getElementById(id);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const localDate=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
let selectedDate=localDate(),monthOpen=false,entryOpen=false;
let bodyMetric='weight',bodyRange=30,foodMetric='kcal',foodRange=7,historyAll={food:false,body:false,workout:false,exercise:false},exPartFilter='全部',workoutFormState={date:localDate(),title:'',memo:''};
const today=localDate(),num=(v,dp=1)=>Number(v||0).toFixed(dp),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(arr,fn)=>arr.reduce((a,x)=>a+fn(x),0),sorted=a=>[...a].sort((x,y)=>y.date.localeCompare(x.date));
try{const d=JSON.parse(localStorage.getItem(KEY+'-draft')||'null');if(d?.form&&Array.isArray(d.items)){workoutFormState=d.form;workoutDraft=d.items}}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('保存容量が不足しています。写真を減らすか、バックアップ後に整理してください。');return false}}
function go(p){page=p;entryOpen=false;render();window.scrollTo(0,0)}
function box(title,body){return `<section class="panel"><h2>${title}</h2>${body}</section>`}
function chart(points,label,unit=''){if(!points.length)return '<p class="empty">グラフ用の記録がまだありません。</p>';const a=[...points].sort((x,y)=>x.date.localeCompare(y.date)).slice(-30),vals=a.map(x=>x.value),mn=Math.min(...vals),mx=Math.max(...vals),range=Math.max(mx-mn,1),xy=a.map((x,i)=>[35+(i/Math.max(a.length-1,1))*565,148-((x.value-mn)/range)*118]);const pts=xy.map(v=>v.join(',')).join(' ');return `<div class="muted">${esc(label)}（直近30件）</div><svg class="chart" viewBox="0 0 620 180" role="img" aria-label="${esc(label)}の推移"><line x1="35" y1="150" x2="600" y2="150" stroke="#cbd5e1"/><line x1="35" y1="30" x2="35" y2="150" stroke="#cbd5e1"/><polyline points="${pts}" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${xy.map((v,i)=>`<circle cx="${v[0]}" cy="${v[1]}" r="4" fill="#2563eb"><title>${esc(a[i].date)}: ${num(a[i].value,2)}${esc(unit)}</title></circle>`).join('')}<text x="3" y="33">${num(mx,1)}</text><text x="3" y="151">${num(mn,1)}</text><text x="35" y="171">${esc(a[0].date.slice(5))}</text><text x="550" y="171">${esc(a.at(-1).date.slice(5))}</text></svg>`}
function render(){document.querySelectorAll('.modal,.fab').forEach(x=>x.remove());document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const views={home:homeView,body:bodyView,food:foodView,workout:workoutView,settings:settingsView,exercise:exerciseView,other:otherView};$('content').innerHTML=(views[page]||homeView)();
if(['food','workout','body'].includes(page)){
 const form=$({food:'foodForm',workout:'workoutForm',body:'bodyForm'}[page]);
 if(form){const panel=form.closest('.panel');const overlay=document.createElement('div');overlay.className='modal'+(entryOpen?'':' hidden');overlay.id='entryModal';overlay.innerHTML='<div class="modal-inner"><button type="button" class="btn modal-close" id="closeEntry">✕ 閉じる</button></div>';
 overlay.querySelector('.modal-inner').append(panel);document.body.append(overlay);
 const fab=document.createElement('button');fab.className='fab';fab.id='entryFab';fab.setAttribute('aria-label','記録を追加');fab.textContent='+';document.body.append(fab);
 fab.onclick=()=>{entryOpen=true;overlay.classList.remove('hidden')};
 $('closeEntry').onclick=()=>{entryOpen=false;overlay.classList.add('hidden')};
 overlay.addEventListener('click',e=>{if(e.target===overlay){entryOpen=false;overlay.classList.add('hidden')}});
 }
}
bind()}
function moveDate(date,n){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return localDate(d)}
function dateMarks(date){return {work:db.workouts.some(x=>x.date===date),food:db.food.some(x=>x.date===date),body:db.body.some(x=>x.date===date)}}
function calCell(date,outside=false){const marks=dateMarks(date),d=new Date(date+'T12:00:00'),week=['日','月','火','水','木','金','土'][d.getDay()];return `<button class="cal-day ${date===selectedDate?'selected':''} ${date===today?'today':''} ${outside?'outside':''}" data-select-date="${date}"><small>${week}</small><span class="daynum">${d.getDate()}</span><span class="dots">${marks.work?'<i class="dot work"></i>':''}${marks.food?'<i class="dot food"></i>':''}${marks.body?'<i class="dot body"></i>':''}</span></button>`}
function calendarView(){const d=new Date(selectedDate+'T12:00:00'),year=d.getFullYear(),month=d.getMonth();let days=[];if(monthOpen){const first=new Date(year,month,1,12),offset=(first.getDay()+6)%7,start=new Date(year,month,1-offset,12);for(let i=0;i<42;i++){const x=new Date(start);x.setDate(start.getDate()+i);days.push(calCell(localDate(x),x.getMonth()!==month))}}else{for(let i=-4;i<=2;i++)days.push(calCell(moveDate(selectedDate,i)))}return `<section class="panel calendar"><div class="calendar-controls"><button class="btn mini" id="calPrev">‹</button><b>${year}年 ${month+1}月</b><div class="row"><button class="btn mini" id="calToday">今日</button><button class="btn mini" id="calToggle" title="週間・月間表示を切り替え">${monthOpen?'週間へ':'▦ 月間'}</button><button class="btn mini" id="calNext">›</button></div></div><div class="cal-days ${monthOpen?'month-grid':''}">${days.join('')}</div><div class="muted" style="margin-top:10px">🟢 筋トレ　🟠 食事　🔵 身体　／　日付を選択すると下の記録が切り替わります</div></section>`}
function rangeData(arr,days){return days===0?arr:arr.filter(x=>x.date>=moveDate(today,-days+1)&&x.date<=today)}
function barHistory(metric,days){const keys={kcal:'カロリー',p:'タンパク質',f:'脂質',c:'炭水化物'},goal=+db.settings[metric]||1,dates=days===0?[...new Set(db.food.map(x=>x.date))].sort():Array.from({length:days},(_,i)=>moveDate(today,i-days+1));const shown=dates.length>120?dates.slice(-120):dates;const w=Math.max(440,shown.length*34+55),h=220;return `<div class="muted">${keys[metric]}の目標達成率（100%が基準線）${dates.length>120?'・最新120日を表示':''}</div><div style="overflow-x:auto"><svg viewBox="0 0 ${w} ${h}" style="width:${w}px;max-width:none;height:220px" role="img" aria-label="日別栄養達成率"><line x1="38" y1="85" x2="${w-10}" y2="85" stroke="#dc2626" stroke-dasharray="5 4" stroke-width="2"/><text x="3" y="88" fill="#dc2626" font-size="12">100%</text><line x1="38" y1="190" x2="${w-10}" y2="190" stroke="#94a3b8"/>${shown.map((d,i)=>{const rows=db.food.filter(x=>x.date===d),v=sum(rows,x=>+x[metric]||0),pct=100*v/goal,bh=Math.min(175,pct*1.05),x=43+i*34,clr=d===today?'#93c5fd':pct>115?'#fb923c':pct>=90?'#10b981':'#60a5fa';return `<rect x="${x}" y="${190-bh}" width="23" height="${bh}" rx="3" fill="${rows.length?clr:'#e2e8f0'}"><title>${d}：${rows.length?pct.toFixed(0)+'%（'+v.toFixed(1)+'）':'未記録'}</title></rect><text x="${x+11}" y="207" font-size="10" fill="#64748b" text-anchor="middle">${d.slice(5).replace('-','/')}</text>`}).join('')}</svg></div><p class="muted">未記録の日は薄い棒、今日の記録は水色で表示。棒をタップすると数値を確認できます。</p>`}
function progressRow(key,label,unit,actual){const target=+db.settings[key]||1,pct=actual/target*100;return `<div class="progressrow"><div class="sectionhead"><b>${label}</b><b>${num(pct,0)}%</b></div><div>${num(actual,key==='kcal'?0:1)} / ${num(target,key==='kcal'?0:1)} ${unit}</div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,pct)}%;background:${pct>110?'#f97316':'#10b981'}"></div></div></div>`}
function limitHistory(arr,type,n){return historyAll[type]?arr:arr.slice(0,n)}
function moreButton(type,count,n){return count>n?`<button class="btn mini" data-more="${type}">${historyAll[type]?'最新'+n+'件だけ表示':'すべての履歴を見る（'+count+'件）'}</button>`:''}
function setLabel(s){return `<span class="pill ${s.type==='warm'?'warm-pill':'plain-pill'}">${s.type==='warm'?'W ':''}${num(s.weight,Number.isInteger(+s.weight)?0:1)}kg × ${s.reps}回</span>`}
function captureWorkoutForm(){const form=$('workoutForm');if(!form)return;workoutFormState={date:form.elements.namedItem('date').value,title:form.elements.namedItem('title').value,memo:form.elements.namedItem('memo').value};readDraft();try{localStorage.setItem(KEY+'-draft',JSON.stringify({form:workoutFormState,items:workoutDraft}))}catch{}}
function redrawWorkoutKeep(){const modal=$('entryModal'),scroll=modal?.querySelector('.modal-inner')?.scrollTop??0;const focus=document.activeElement?.getAttribute('data-setfield');captureWorkoutForm();render();if(entryOpen){const inner=$('entryModal')?.querySelector('.modal-inner');if(inner)inner.scrollTop=scroll}}
function selectedSummary(){const food=db.food.filter(x=>x.date===selectedDate),body=db.body.find(x=>x.date===selectedDate),work=db.workouts.filter(x=>x.date===selectedDate),f=foodTotal(food);return `<section class="panel"><div class="sectionhead"><h2>${esc(selectedDate)} の記録</h2><span class="muted">日付をタップして切替</span></div><div class="stats"><div><small>💪 筋トレ</small><strong>${work.length?'実施 '+work.length+'回':'記録なし'}</strong><small>${work.flatMap(x=>x.items).length}種目</small></div><div><small>🍚 食事</small><strong>${num(f.kcal,0)} kcal</strong><small>P ${num(f.p)}g / ${food.length}食</small></div><div><small>⚖️ 体重</small><strong>${body?num(body.weight)+'kg':'記録なし'}</strong><small>${body?'体脂肪 '+num(body.fat)+'%':''}</small></div></div></section>`}
function homeView(){const b=sorted(db.body)[0],food=db.food.filter(x=>x.date===today),work=sorted(db.workouts)[0],cal=sum(food,x=>x.kcal);return `${calendarView()}${selectedSummary()}<div class="grid" style="margin-top:18px"><button class="metric" data-go="body"><span>⚖️ 最新の体重</span><b>${b?num(b.weight)+' kg':'未記録'}</b><span>${b?esc(b.date):'身体記録を追加'}</span></button><button class="metric" data-go="food"><span>🍚 今日の摂取</span><b>${num(cal,0)} kcal</b><span>目標 ${num(db.settings.kcal,0)} kcal</span></button><button class="metric" data-go="workout"><span>💪 最後のトレーニング</span><b>${work?esc(work.date.slice(5)):'未記録'}</b><span>${work?work.items.length+'種目':'トレーニングを追加'}</span></button></div>${box('今日の栄養バランス',`<div class="stats">${[['P',sum(food,x=>x.p),db.settings.p],['F',sum(food,x=>x.f),db.settings.f],['C',sum(food,x=>x.c),db.settings.c]].map(([n,v,t])=>`<div><small>${n}</small><strong>${num(v)} / ${num(t)} g</strong></div>`).join('')}</div>`)}${box('使い方',`<p>食事：外部AIの栄養計算を貼り付けて記録。<br>筋トレ：1セットずつ記録し、種目別の自己ベストを確認。<br>身体：体重計の「体重・体脂肪率・筋肉率」をそのまま入力。</p><p class="muted">記録はこのブラウザに保存されます。設定から定期的にバックアップしてください。</p>`)}`}

prev.weight)+' kg':''}</p>`):''}${box('身体データの推移',`<div class="row">${[['weight','体重'],['fat','体脂肪率'],['muscleRate','筋肉率'],['muscleMass','推定筋肉量']].map(([k,l])=>`<button class="btn mini ${bodyMetric===k?'primary':''}" data-body-metric="${k}">${l}</button>`).join('')}</div><div class="row" style="margin-top:12px">${[[7,'7日'],[30,'30日'],[90,'90日'],[0,'全期間']].map(([k,l])=>`<button class="btn mini ${bodyRange===k?'primary':''}" data-body-range="${k}">${l}</button>`).join('')}</div>${chart(rangeData(db.body,bodyRange).map(x=>({date:x.date,value:bodyMetric==='muscleMass'?x.weight*x.muscleRate/100:x[bodyMetric]})),bodyMetric==='weight'?'体重':bodyMetric==='fat'?'体脂肪率':bodyMetric==='muscleRate'?'筋肉率':'推定筋肉量',['weight','muscleMass'].includes(bodyMetric)?'kg':'%')}`)}${box('身体記録の履歴',a.length?limitHistory(a,'body',7).map(x=>`<div class="item"><div class="sectionhead"><div><b>${esc(x.date)}</b><p>${num(x.weight)}kg / 体脂肪 ${num(x.fat)}% / 筋肉率 ${num(x.muscleRate)}%</p></div><div class="row"><button class="btn mini" data-body-edit="${esc(x.id)}">編集</button><button class="btn mini danger" data-body-del="${esc(x.id)}">削除</button></div></div></div>`).join('')+moreButton('body',a.length,7):'<p class="empty">記録はまだありません。</p>')}`}

function foodView(){const a=sorted(db.food),t=foodTotal(db.food.filter(x=>x.date===today));return `<h2 style="margin:18px 0 0">🍚 食事管理</h2>${box('栄養サマリー',`<div class="stats"><div><small>今日のカロリー</small><strong>${num(t.kcal,0)} kcal</strong><small>目標 ${num(db.settings.kcal,0)} kcal</small></div><div><small>今日のタンパク質</small><strong>${num(t.p)} g</strong><small>目標 ${num(db.settings.p)} g</small></div><div><small>直近7日間の1日平均</small><strong>${num(sum(db.food.filter(x=>x.date>=moveDate(today,-6)&&x.date<=today),x=>x.kcal)/7,0)} kcal</strong></div></div>`)}${box(foodEdit?'食事記録を編集':'食事を記録',`<form id="foodForm" class="formgrid"><label>日付<input name="date" type="date" required value="${esc(foodEdit?.date||today)}"></label><label>食事区分<select name="meal">${['朝食','昼食','夕食','間食'].map(v=>`<option ${foodEdit?.meal===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="wide">食事内容<textarea name="content" required placeholder="例：鶏むね肉150g、ご飯200g">${esc(foodEdit?.content||'')}</textarea></label><label class="wide">外部AIの計算結果を貼り付け（任意）<textarea id="aiText" placeholder="例：650kcal P25g F52g C15g"></textarea></label><div class="wide row"><button class="btn" id="parseAi" type="button">✨ 数値を自動振り分け</button><span class="muted">日本語の「タンパク質 25g」等にも対応</span></div><label>カロリー (kcal)<input name="kcal" type="number" min="0" max="20000" step=".1" required value="${esc(foodEdit?.kcal??'')}"></label><label>タンパク質 P (g)<input name="p" type="number" min="0" max="2000" step=".1" required value="${esc(foodEdit?.p??'')}"></label><label>脂質 F (g)<input name="f" type="number" min="0" max="2000" step=".1" required value="${esc(foodEdit?.f??'')}"></label><label>炭水化物 C (g)<input name="c" type="number" min="0" max="2000" step=".1" required value="${esc(foodEdit?.c??'')}"></label><label class="wide">一言メモ<textarea name="memo" placeholder="満腹感、感想など">${esc(foodEdit?.memo||'')}</textarea></label><label class="wide">食事写真（複数選択可・1枚約600pxに縮小）<input type="file" id="photoInput" accept="image/*" multiple></label><div id="photoPreview" class="wide photos"></div><div class="wide row"><button class="btn primary" type="submit">${foodEdit?'変更を保存':'食事を保存'}</button>${foodEdit?'<button class="btn" id="foodCancel" type="button">編集をやめる</button>':''}</div></form><p class="muted">写真は端末内に保存されます。写真が多いと保存容量の上限に達することがあります。</p>`)}${box('今日の目標達成率',`<div class="progress-grid">${progressRow('kcal','カロリー','kcal',t.kcal)}${progressRow('p','タンパク質','g',t.p)}${progressRow('f','脂質','g',t.f)}${progressRow('c','炭水化物','g',t.c)}</div>`)}${box('栄養達成率の履歴',`<div class="row">${[['kcal','カロリー'],['p','P'],['f','F'],['c','C']].map(([k,l])=>`<button class="btn mini ${foodMetric===k?'primary':''}" data-food-metric="${k}">${l}</button>`).join('')}</div><div class="row" style="margin-top:12px">${[[7,'7日'],[30,'30日'],[90,'90日'],[0,'全期間']].map(([k,l])=>`<button class="btn mini ${foodRange===k?'primary':''}" data-food-range="${k}">${l}</button>`).join('')}</div>${barHistory(foodMetric,foodRange)}`)}${box('今日の合計',`<div class="stats">${[['カロリー',t.kcal,'kcal',db.settings.kcal],['P',t.p,'g',db.settings.p],['F',t.f,'g',db.settings.f],['C',t.c,'g',db.settings.c]].map(([name,v,u,goal])=>`<div><small>${name}</small><strong>${num(v)} ${u}</strong><small>目標 ${num(goal)} ${u}</small></div>`).join('')}</div>`)}${box('日別カロリー推移',chart(Object.entries(Object.groupBy?Object.groupBy(db.food,x=>x.date):db.food.reduce((o,x)=>((o[x.date]??=[]).push(x),o),{})).map(([date,a])=>({date,value:sum(a,x=>x.kcal)})),'カロリー','kcal'))}${box('食事履歴',a.length?limitHistory(a,'food',5).map(x=>`<div class="item"><div class="sectionhead"><div><b>${esc(x.date)}・${esc(x.meal)}</b><p>${esc(x.content).replace(/\n/g,'<br>')}</p><span class="pill">${num(x.kcal,0)} kcal</span><span class="pill">P ${num(x.p)} / F ${num(x.f)} / C ${num(x.c)}</span>${x.memo?`<p class="muted">💬 ${esc(x.memo)}</p>`:''}</div><div class="row"><button class="btn mini" data-food-copy="${esc(x.id)}">コピー</button><button class="btn mini" data-food-edit="${esc(x.id)}">編集</button><button class="btn mini danger" data-food-del="${esc(x.id)}">削除</button></div></div><div class="photos">${(x.photos||[]).map(src=>`<img src="${src}" alt="食事写真">`).join('')}</div></div>`).join('')+moreButton('food',a.length,5):'<p class="empty">記録はまだありません。</p>')}`}
function parseNutrition(s){const patterns={kcal:/(?:カロリー|エネルギー|熱量|kcal|calories?)\s*[:：=]?\s*([\d,.]+)\s*(?:kcal)?/i,p:/(?:タンパク質|たんぱく質|蛋白質|protein|P)\s*[:：=]?\s*([\d,.]+)\s*g?/i,f:/(?:脂質|fat|F)\s*[:：=]?\s*([\d,.]+)\s*g?/i,c:/(?:炭水化物|糖質|carbs?|C)\s*[:：=]?\s*([\d,.]+)\s*g?/i};const out={};for(const [k,r] of Object.entries(patterns)){let m=s.match(r);if(!m&&k==='kcal')m=s.match(/([\d,.]+)\s*kcal/i);if(m)out[k]=Number(m[1].replace(/,/g,''))}return out}
function resizePhoto(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(Error('画像を読めません'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(Error('画像を開けません'));img.onload=()=>{const max=700,scale=Math.min(1,max/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.72))};img.src=reader.result};reader.readAsDataURL(file)})}
function exName(id){return db.exercises.find(x=>x.id===id)?.name||'削除された種目'}
function exPart(id){return db.exercises.find(x=>x.id===id)?.part||'その他'}
function setStats(sets){const main=sets.filter(s=>s.type==='main'),volume=sum(main,s=>s.weight*s.reps),maxWeight=Math.max(0,...main.map(s=>s.weight)),e1rm=Math.max(0,...main.filter(s=>s.reps<=12).map(s=>s.weight*(1+s.reps/30)));return {volume,maxWeight,e1rm,main:main.length,warm:sets.length-main.length}}
function newDraft(){workoutDraft=[{exerciseId:db.exercises[0]?.id||'',sets:[{type:'warm',weight:20,reps:10},{type:'main',weight:40,reps:10}]}]}

'))}${box('トレーニング履歴',a.length?limitHistory(a,'workout',5).map(w=>{const ss=w.items.flatMap(x=>x.sets),s=setStats(ss);return `<div class="item"><div class="sectionhead"><div><b>${esc(w.date)} ${esc(w.title||'')}</b><p>${w.items.map(x=>esc(exName(x.exerciseId))).join(' / ')}</p><span class="pill">${s.main}セット</span><span class="pill">総ボリューム ${num(s.volume,0)}kg</span></div><div class="row"><button class="btn mini" data-work-copy="${esc(w.id)}">コピー</button><button class="btn mini" data-work-edit="${esc(w.id)}">編集</button><button class="btn mini danger" data-work-del="${esc(w.id)}">削除</button></div></div>${w.memo?`<p class="muted">💬 ${esc(w.memo)}</p>`:''}${w.items.map(x=>`<p><b>${esc(exName(x.exerciseId))}</b>：${x.sets.map(setLabel).join(' ')}</p>${x.memo?`<p class="muted">💬 ${esc(x.memo)}</p>`:''}`).join('')}</div>`}).join('')+moreButton('workout',a.length,5):'<p class="empty">記録はまだありません。</p>')}`}
function draftExHtml(x,i){return `<div class="exercise" data-exidx="${i}"><div class="row"><label style="flex:1">種目<select data-field="exerciseId">${db.exercises.map(e=>`<option value="${esc(e.id)}" ${x.exerciseId===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></label><button class="btn mini danger" type="button" data-remove-ex="${i}">種目削除</button></div><table class="sets"><thead><tr><th>区分</th><th>重量kg</th><th>回数</th><th></th></tr></thead><tbody>${x.sets.map((s,j)=>`<tr class="${s.type==='warm'?'warm-set':''}" data-setidx="${j}"><td><select data-setfield="type"><option value="warm" ${s.type==='warm'?'selected':''}>W</option><option value="main" ${s.type==='main'?'selected':''}>通常</option></select></td><td><input class="num" data-setfield="weight" type="number" min="0" max="1000" step=".5" value="${esc(s.weight)}" required></td><td><input class="num" data-setfield="reps" type="number" min="1" max="1000" step="1" value="${esc(s.reps)}" required></td><td><button class="btn mini danger remove" type="button" data-remove-set="${i}:${j}">×</button></td></tr>`).join('')}</tbody></table><label>種目メモ（任意）<textarea data-field="memo" placeholder="フォーム、感覚、次回の目標など">${esc(x.memo||'')}</textarea></label><button class="btn mini" type="button" data-add-set="${i}">＋ セット追加</button></div>`}
function exerciseView(){const ex=db.exercises.find(x=>x.id===exerciseSelected);if(!ex)return workoutView();const sessions=sorted(db.workouts.flatMap(w=>w.items.filter(it=>it.exerciseId===ex.id).map(it=>({...it,date:w.date,workoutId:w.id}))));const all=sessions.flatMap(x=>x.sets.filter(s=>s.type==='main'));const stats=setStats(all);return `<div class="row" style="margin-top:16px"><button class="btn" data-go="workout">← 筋トレに戻る</button></div>${box('🏷️ '+esc(ex.name),`<div class="row"><span class="pill">${esc(ex.part)}</span><button class="btn mini" id="renameEx">種目名を変更</button><button class="btn mini danger" id="deleteEx">ラベルを削除</button></div><div class="stats" style="margin-top:12px"><div><small>最大使用重量</small><strong>${num(stats.maxWeight)}kg</strong></div><div><small>最大推定1RM</small><strong>${num(stats.e1rm)}kg</strong></div><div><small>実施回数</small><strong>${sessions.length}回</strong></div></div>`)}${box('推定1RMの推移',chart(sessions.map(x=>({date:x.date,value:setStats(x.sets).e1rm})).filter(x=>x.value>0),'推定1RM','kg'))}${box('種目別履歴',sessions.length?limitHistory(sessions,'exercise',5).map(x=>`<div class="item"><b>${esc(x.date)}</b><p>${x.sets.map(setLabel).join('')}</p>${x.memo?`<p class="muted">💬 ${esc(x.memo)}</p>`:''}<p class="muted">ボリューム ${num(setStats(x.sets).volume,0)} kg</p></div>`).join('')+moreButton('exercise',sessions.length,5):'<p class="empty">まだ記録がありません。</p>')}`}
function otherView(){const extras=db.exercises.filter(x=>!['ex-bench','ex-squat','ex-dead'].includes(x.id)),filtered=extras.filter(x=>exPartFilter==='全部'||x.part===exPartFilter);return `<div class="row" style="margin-top:16px"><button class="btn" data-go="workout">← 筋トレに戻る</button></div>${box('その他の種目',`<div class="row">${['全部','胸','背中','脚','肩','腕','腹','全身','その他'].map(x=>`<button class="btn mini ${exPartFilter===x?'primary':''}" data-ex-part="${x}">${x}</button>`).join('')}</div><div class="exercise-list">${filtered.map(x=>`<button class="btn" data-ex="${esc(x.id)}">${esc(x.name)} <small>${esc(x.part)}</small> ↗</button>`).join('')||'<p class="empty">この部位の種目はまだありません。</p>'}</div>`)}${box('種目を追加',`<form id="exForm" class="formgrid"><label>種目名<input name="name" required placeholder="例：ラットプルダウン"></label><label>部位<select name="part">${['胸','背中','脚','肩','腕','腹','全身','その他'].map(x=>`<option>${x}</option>`).join('')}</select></label><div class="wide"><button class="btn primary">＋ 種目を追加</button></div></form>`)}`}
function settingsView(){return `<h2 style="margin:18px 0 0">⚙️ 設定・バックアップ</h2>${box('目標設定',`<form id="settingsForm" class="formgrid">${[['height','身長 (cm)'],['weightGoal','目標体重 (kg)'],['kcal','目標カロリー (kcal)'],['p','目標P (g)'],['f','目標F (g)'],['c','目標C (g)']].map(([key,label])=>`<label>${label}<input name="${key}" type="number" step=".1" min="${key==='height'?50:0}" max="10000" required value="${esc(db.settings[key])}"></label>`).join('')}<div class="wide"><button class="btn primary">設定を保存</button></div></form>`)}${box('データのバックアップ',`<p>すべての記録と写真をJSONファイルに書き出せます。復元は現在のデータを置き換えます。</p><div class="row"><button class="btn primary" id="exportBtn">バックアップを保存</button><label style="flex:1">バックアップから復元<input id="importInput" type="file" accept=".json,application/json"></label></div><p class="muted">写真が多い場合、バックアップファイルが大きくなります。ブラウザのデータ削除・端末故障に備えて別の場所にも保存してください。</p>`)}<p class="muted">LIFE OS Health v1.2｜端末内保存・外部送信なし</p>`}
function readDraft(){document.querySelectorAll('.exercise[data-exidx]').forEach(el=>{const i=+el.dataset.exidx;if(!workoutDraft[i])return;workoutDraft[i].exerciseId=el.querySelector('[data-field=exerciseId]').value;workoutDraft[i].memo=el.querySelector('[data-field=memo]')?.value||'';el.querySelectorAll('[data-setidx]').forEach(row=>{const j=+row.dataset.setidx;if(!workoutDraft[i].sets[j])return;for(const field of ['type','weight','reps']){const v=row.querySelector(`[data-setfield=${field}]`).value;workoutDraft[i].sets[j][field]=field==='type'?v:Number(v)}})})}
function resetWorkout(){workoutEdit=null;entryOpen=false;workoutFormState={date:today,title:'',memo:''};try{localStorage.removeItem(KEY+'-draft')}catch{}newDraft();render()}
function bind(){
if($('calPrev')){$('calPrev').onclick=()=>{selectedDate=moveDate(selectedDate,monthOpen?-28:-7);render()};$('calNext').onclick=()=>{selectedDate=moveDate(selectedDate,monthOpen?28:7);render()};$('calToday').onclick=()=>{selectedDate=today;render()};$('calToggle').onclick=()=>{monthOpen=!monthOpen;render()};document.querySelectorAll('[data-select-date]').forEach(el=>el.onclick=()=>{selectedDate=el.dataset.selectDate;render()})}
document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(el.dataset.go));
if($('bodyForm')){$('bodyForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),r={id:bodyEdit?.id||uid(),date:f.get('date'),weight:+f.get('weight'),fat:+f.get('fat'),muscleRate:+f.get('muscleRate')};if(!(r.weight>0&&r.weight<=400&&r.fat>=0&&r.fat<=100&&r.muscleRate>=0&&r.muscleRate<=100)){alert('数値を確認してください');return}const old=db.body.slice();db.body=db.body.filter(x=>x.id!==r.id);db.body.push(r);if(!save()){db.body=old;return}bodyEdit=null;entryOpen=false;render()};if($('bodyCancel'))$('bodyCancel').onclick=()=>{bodyEdit=null;entryOpen=false;render()};document.querySelectorAll('[data-body-edit]').forEach(el=>el.onclick=()=>{bodyEdit=db.body.find(x=>x.id===el.dataset.bodyEdit);entryOpen=true;render()});document.querySelectorAll('[data-body-del]').forEach(el=>el.onclick=()=>{if(confirm('身体記録を削除しますか？')){db.body=db.body.filter(x=>x.id!==el.dataset.bodyDel);save();render()}})}
if($('foodForm')){pendingPhotos=foodEdit?(foodEdit.photos||[]).slice():[];function preview(){$('photoPreview').innerHTML=pendingPhotos.map((src,i)=>`<div><img src="${src}" alt="追加する写真"><br><button type="button" class="btn mini danger" data-photo-del="${i}">削除</button></div>`).join('');document.querySelectorAll('[data-photo-del]').forEach(el=>el.onclick=()=>{pendingPhotos.splice(+el.dataset.photoDel,1);preview()})}preview();$('photoInput').onchange=async e=>{for(const file of [...e.target.files].slice(0,12)){if(!file.type.startsWith('image/'))continue;try{pendingPhotos.push(await resizePhoto(file))}catch{alert('画像を読み込めませんでした')}}preview();e.target.value=''};$('parseAi').onclick=()=>{const vals=parseNutrition($('aiText').value);for(const [k,v] of Object.entries(vals))$('foodForm').elements.namedItem(k).value=v;alert(Object.keys(vals).length?`${Object.keys(vals).length}項目を読み取りました。数値を確認してください。`:'数値を読み取れませんでした。例：650kcal P25g F52g C15g')};$('foodForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),r={id:foodEdit?.id||uid(),date:f.get('date'),meal:f.get('meal'),content:f.get('content').trim(),memo:f.get('memo'),photos:[...pendingPhotos]};for(const k of ['kcal','p','f','c'])r[k]=+f.get(k);if(!r.content||['kcal','p','f','c'].some(k=>!Number.isFinite(r[k])||r[k]<0)){alert('入力を確認してください');return}const old=db.food.slice();db.food=db.food.filter(x=>x.id!==r.id);db.food.push(r);if(!save()){db.food=old;return}foodEdit=null;entryOpen=false;render()};if($('foodCancel'))$('foodCancel').onclick=()=>{foodEdit=null;entryOpen=false;render()};document.querySelectorAll('[data-food-edit]').forEach(el=>el.onclick=()=>{foodEdit=db.food.find(x=>x.id===el.dataset.foodEdit);entryOpen=true;render();window.scrollTo(0,0)});document.querySelectorAll('[data-food-copy]').forEach(el=>el.onclick=()=>{const r=db.food.find(x=>x.id===el.dataset.foodCopy);foodEdit={...r,id:null,date:today,photos:[...(r.photos||[])]};entryOpen=true;render();window.scrollTo(0,0)});document.querySelectorAll('[data-food-del]').forEach(el=>el.onclick=()=>{if(confirm('食事記録を削除しますか？')){db.food=db.food.filter(x=>x.id!==el.dataset.foodDel);save();render()}})}
if($('exForm')){$('exForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')).trim();if(!name)return;if(db.exercises.some(x=>x.name===name)){alert('同じ種目名があります');return}db.exercises.push({id:uid(),name,part:f.get('part')});save();render()};document.querySelectorAll('[data-ex]').forEach(el=>el.onclick=()=>{exerciseSelected=el.dataset.ex;go('exercise')});}
if($('workoutForm')){
 $('workoutForm').addEventListener('input',()=>{captureWorkoutForm()});
 $('workoutForm').addEventListener('change',()=>{captureWorkoutForm()});
 $('addExercise').onclick=()=>{captureWorkoutForm();workoutDraft.push({exerciseId:db.exercises[0]?.id||'',sets:[{type:'main',weight:0,reps:10}],memo:''});const sc=$('entryModal')?.querySelector('.modal-inner')?.scrollTop||0;render();$('entryModal')?.querySelector('.modal-inner')?.scrollTo(0,sc)};
 document.querySelectorAll('[data-add-set]').forEach(el=>el.onclick=()=>{captureWorkoutForm();const i=+el.dataset.addSet,sets=workoutDraft[i].sets,last=sets.at(-1)||{type:'main',weight:0,reps:10};sets.push({...last});const sc=$('entryModal')?.querySelector('.modal-inner')?.scrollTop||0;render();$('entryModal')?.querySelector('.modal-inner')?.scrollTo(0,sc)});
 document.querySelectorAll('[data-remove-set]').forEach(el=>el.onclick=()=>{captureWorkoutForm();const [i,j]=el.dataset.removeSet.split(':').map(Number);workoutDraft[i].sets.splice(j,1);const sc=$('entryModal')?.querySelector('.modal-inner')?.scrollTop||0;render();$('entryModal')?.querySelector('.modal-inner')?.scrollTo(0,sc)});
 document.querySelectorAll('[data-remove-ex]').forEach(el=>el.onclick=()=>{captureWorkoutForm();workoutDraft.splice(+el.dataset.removeEx,1);const sc=$('entryModal')?.querySelector('.modal-inner')?.scrollTop||0;render();$('entryModal')?.querySelector('.modal-inner')?.scrollTo(0,sc)});
 $('workoutForm').onsubmit=e=>{e.preventDefault();captureWorkoutForm();if(!workoutDraft.length||workoutDraft.some(x=>!x.exerciseId||!x.sets.length||x.sets.some(s=>!Number.isFinite(s.weight)||s.weight<0||s.weight>1000||!Number.isInteger(s.reps)||s.reps<1||s.reps>1000))){alert('種目と各セットの重量・回数を確認してください');return}const r={id:workoutEdit?.id||uid(),date:workoutFormState.date,title:workoutFormState.title,memo:workoutFormState.memo,items:structuredClone(workoutDraft)};const old=db.workouts.slice();db.workouts=db.workouts.filter(x=>x.id!==r.id);db.workouts.push(r);if(!save()){db.workouts=old;return}resetWorkout()};
 if($('workoutCancel'))$('workoutCancel').onclick=resetWorkout;
 document.querySelectorAll('[data-work-edit]').forEach(el=>el.onclick=()=>{workoutEdit=db.workouts.find(x=>x.id===el.dataset.workEdit);workoutDraft=structuredClone(workoutEdit.items);workoutFormState={date:workoutEdit.date,title:workoutEdit.title||'',memo:workoutEdit.memo||''};entryOpen=true;render()});
 document.querySelectorAll('[data-work-copy]').forEach(el=>el.onclick=()=>{const w=db.workouts.find(x=>x.id===el.dataset.workCopy);workoutEdit={...w,id:null,date:today};workoutDraft=structuredClone(w.items);workoutFormState={date:today,title:w.title||'',memo:w.memo||''};entryOpen=true;render()});
 document.querySelectorAll('[data-work-del]').forEach(el=>el.onclick=()=>{if(confirm('トレーニングを削除しますか？')){db.workouts=db.workouts.filter(x=>x.id!==el.dataset.workDel);save();render()}})
}

document.querySelectorAll('[data-ex]').forEach(el=>el.onclick=()=>{exerciseSelected=el.dataset.ex;go('exercise')});
document.querySelectorAll('[data-ex-part]').forEach(el=>el.onclick=()=>{exPartFilter=el.dataset.exPart;render()});
document.querySelectorAll('[data-more]').forEach(el=>el.onclick=()=>{historyAll[el.dataset.more]=!historyAll[el.dataset.more];render()});
document.querySelectorAll('[data-food-metric]').forEach(el=>el.onclick=()=>{foodMetric=el.dataset.foodMetric;render()});
document.querySelectorAll('[data-food-range]').forEach(el=>el.onclick=()=>{foodRange=+el.dataset.foodRange;render()});
document.querySelectorAll('[data-body-metric]').forEach(el=>el.onclick=()=>{bodyMetric=el.dataset.bodyMetric;render()});
document.querySelectorAll('[data-body-range]').forEach(el=>el.onclick=()=>{bodyRange=+el.dataset.bodyRange;render()});
if($('renameEx'))$('renameEx').onclick=()=>{const x=db.exercises.find(x=>x.id===exerciseSelected),name=prompt('新しい種目名',x.name)?.trim();if(!name||db.exercises.some(y=>y.id!==x.id&&y.name===name))return;x.name=name;save();render()};
if($('deleteEx'))$('deleteEx').onclick=()=>{const x=db.exercises.find(x=>x.id===exerciseSelected);if(db.workouts.some(w=>w.items.some(it=>it.exerciseId===x.id))){alert('記録がある種目ラベルは削除できません。');return}if(confirm('種目ラベルを削除しますか？')){db.exercises=db.exercises.filter(y=>y.id!==x.id);save();go('workout')}};
if($('settingsForm')){$('settingsForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);for(const k of Object.keys(db.settings)){const n=+f.get(k);if(!Number.isFinite(n)||n<(k==='height'?50:0)){alert('設定値を確認してください');return}db.settings[k]=n}save();render()};$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'LIFE OS Health',version:1,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`life-os-health-${today}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importInput').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.app!=='LIFE OS Health'||obj.version!==1||!obj.data||!Array.isArray(obj.data.body)||!Array.isArray(obj.data.food)||!Array.isArray(obj.data.exercises)||!Array.isArray(obj.data.workouts)||!obj.data.settings)throw Error('形式が違います');if(!confirm('現在の記録をすべて置き換えます。よろしいですか？'))return;const old=db;db=obj.data;if(!save()){db=old;return}bodyEdit=foodEdit=workoutEdit=null;go('home');alert('復元しました')}catch{alert('バックアップを読み込めませんでした')}}}
}
$('settingsBtn').onclick=()=>go('settings');$('tabs').onclick=e=>{const btn=e.target.closest('[data-page]');if(btn){bodyEdit=foodEdit=workoutEdit=null;go(btn.dataset.page)}};render();
</script><script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Offline setup failed', err)));
